<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欠勤連絡管理画面</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #eee; }
        .controls { margin-bottom: 20px; }
        button { 
            padding: 10px 15px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            border-radius: 4px;
        }
        button:hover { background-color: #218838; }
        #status { margin-top: 10px; color: #666; }
    </style>
</head>
<body>

    <h1>欠勤連絡一覧 (管理画面)</h1>
    
    <div class="controls">
        <button onclick="downloadExcel()">Excel形式でダウンロード</button>
        <p id="status">データを読み込んでいます...</p>
    </div>

    <table id="absenceTable">
        <thead>
            <tr>
                <th>日時</th>
                <th>名前</th>
                <th>所属</th>
                <th>理由</th>
                <th>詳細</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script>
        // GitHub Pages上のCSVファイルのパス
        const csvUrl = 'https://oyasumi-rennraku.github.io/absence-form/absence_data.csv';

        async function fetchCSV() {
            try {
                // キャッシュ回避のためタイムスタンプを付与
                const response = await fetch(`${csvUrl}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('データの読み込みに失敗しました');
                
                const csvText = await response.text();
                displayData(csvText);
                document.getElementById('status').innerText = '最新のデータを表示中';
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'エラー: データの取得に失敗しました';
            }
        }

        function displayData(csvText) {
            const lines = csvText.trim().split('\n');
            const tbody = document.querySelector('#absenceTable tbody');
            tbody.innerHTML = '';

            // ヘッダーを除いた2行目からループ
            for (let i = 1; i < lines.length; i++) {
                // カンマ区切りだが、詳細欄の引用符や改行に対応するため簡易的な正規表現で分割
                const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (row.length < 5) continue;

                const tr = document.createElement('tr');
                row.forEach((cell, index) => {
                    const td = document.createElement('td');
                    // 引用符の除去と改行コードの置換
                    td.innerText = cell.replace(/^"|"$/g, '').replace(/\\n/g, '\n');
                    tr.appendChild(td);
                });
                tbody.prepend(tr); // 新しい連絡を上に表示
            }
        }

        function downloadExcel() {
            const table = document.getElementById("absenceTable");
            
            // 1. テーブルからワークシートを作成
            const ws = XLSX.utils.table_to_sheet(table);

            // 2. 列幅の設定 (wpx = ピクセル)
            ws['!cols'] = [
                { wpx: 140 }, // 日時
                { wpx: 100 }, // 名前
                { wpx: 80 },  // 所属
                { wpx: 100 }, // 理由
                { wpx: 450 }  // 詳細（長文が見えるように広く設定）
            ];

            // 3. すべてのセルに対して「折り返し設定」を付与
            // (Excelで開いた時に自動で高さが調整されるようにします)
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cell_address = { c: C, r: R };
                    const cell_ref = XLSX.utils.encode_cell(cell_address);
                    if (!ws[cell_ref]) continue;
                    if (!ws[cell_ref].s) ws[cell_ref].s = {};
                    ws[cell_ref].s.alignment = { wrapText: true, vertical: 'top' };
                }
            }

            // 4. ワークブックの作成と保存
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "欠勤連絡一覧");

            const now = new Date();
            const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            XLSX.writeFile(wb, `野田瀬戸支店_欠勤連絡_${dateStr}.xlsx`);
        }

        // 初回読み込み
        fetchCSV();
    </script>
</body>
</html>
