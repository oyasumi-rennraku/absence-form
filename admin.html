<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>野田瀬戸支店 欠勤連絡 管理ページ（閲覧・CSV）</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;padding:20px}
    .card{max-width:1050px;margin:auto;background:#fff;padding:18px;border-radius:10px}
    h2{margin:0 0 12px;text-align:center}
    label{display:block;margin-top:10px;font-weight:600}
    input,button{width:100%;padding:10px;margin-top:6px;font-size:16px;box-sizing:border-box}
    button{background:#0070f3;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-top:12px}
    button:disabled{background:#999;cursor:not-allowed}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
    table{width:100%;border-collapse:collapse;margin-top:14px}
    th,td{border:1px solid #ddd;padding:8px;font-size:14px;vertical-align:top}
    th{background:#fafafa}
    #msg{margin-top:10px;font-weight:700;text-align:center}
    .muted{color:#666;font-size:12px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .pill{font-size:12px;background:#f0f0f0;padding:6px 10px;border-radius:999px}
    
    /* ページネーション用スタイル */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }
    .pagination button {
      width: auto;
      padding: 8px 16px;
      margin-top: 0;
    }
    .page-info {
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="topbar">
      <h2>野田瀬戸支店 欠勤連絡 管理ページ（閲覧・CSV）</h2>
      <div class="pill">管理者のみ共有（URL秘匿）</div>
    </div>

    <div class="row">
      <label>開始日（任意）
        <input id="startDate" type="date">
      </label>
      <label>終了日（任意）
        <input id="endDate" type="date">
      </label>
    </div>

    <div class="actions">
      <button id="searchBtn">表示（検索）</button>
      <button id="csvBtn" style="background:#2b7;">CSVダウンロード（全件）</button>
    </div>

    <div id="msg"></div>
    <div class="muted">※ 日付は日本時間（JST）で指定。未指定なら全件対象。</div>

    <table id="tbl" style="display:none;">
      <thead>
        <tr>
          <th>送信日時</th>
          <th>名前</th>
          <th>所属</th>
          <th>区分</th>
          <th>理由</th>
          <th>コメント</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <!-- ページ切替エリア -->
    <div id="pagination" class="pagination" style="display:none;">
      <button id="prevBtn">＜ 前の30件</button>
      <span id="pageInfo" class="page-info">1 ページ目</span>
      <button id="nextBtn">次の30件 ＞</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://ffpuqxyufqugotivqkgi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_5247tSd7ptdrSv6y0972rA_zm_6t99i";

  const PAGE_SIZE = 30; // 1ページあたりの表示件数
  let currentPage = 1;
  let totalRowsCount = 0;

  const msg = (t)=>{ const el=document.getElementById("msg"); if(el) el.innerText=t||""; };
  const showTable = (on)=>{ 
    const t=document.getElementById("tbl"); 
    const p=document.getElementById("pagination");
    if(t) t.style.display = on ? "table" : "none"; 
    if(p) p.style.display = on ? "flex" : "none";
  };

  function esc(v){ return v==null ? "" : String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
  function fmtJstText(s){ return s ? String(s).replace("T", " ").slice(0, 19) : ""; }

  // データ取得関数（isForCsvがtrueの場合は全件、falseの場合は30件ずつ）
  async function fetchRows(isForCsv = false){
    const start = document.getElementById("startDate").value;
    const end = document.getElementById("endDate").value;

    const params = new URLSearchParams();
    params.set("select", "created_at_jst,name,department,report_type,type,comment");
    params.set("order", "created_at_jst.desc"); // 最新順に表示

    if (start) params.append("created_at_jst", `gte.${start}T00:00:00`);
    if (end)   params.append("created_at_jst", `lte.${end}T23:59:59`);

    // 画面表示用の場合は30件ずつ取得（ページネーション）
    if (!isForCsv) {
      const from = (currentPage - 1) * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;
      
      const url = `${SUPABASE_URL}/rest/v1/absence_reports?${params.toString()}`;
      const res = await fetch(url, {
        headers: { 
          "apikey": SUPABASE_KEY, 
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Range": `${from}-${to}`,
          "Prefer": "count=exact"
        }
      });

      if (!res.ok) throw new Error("取得失敗");
      
      // 総件数の取得
      const contentRange = res.headers.get("content-range");
      if (contentRange) {
        totalRowsCount = parseInt(contentRange.split("/")[1]) || 0;
      }
      
      return await res.json();
    } else {
      // CSV用は全件取得
      const url = `${SUPABASE_URL}/rest/v1/absence_reports?${params.toString()}`;
      const res = await fetch(url, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
      });
      if (!res.ok) throw new Error("取得失敗");
      return await res.json();
    }
  }

  function renderTable(rows){
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    rows.forEach(r=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(fmtJstText(r.created_at_jst))}</td>
        <td>${esc(r.name)}</td>
        <td>${esc(r.department)}</td>
        <td>${esc(r.report_type || "")}</td>
        <td>${esc(r.type)}</td>
        <td>${esc(r.comment)}</td>
      `;
      tbody.appendChild(tr);
    });
    showTable(rows.length > 0);
    updatePaginationControls();
  }

  function updatePaginationControls() {
    const maxPage = Math.ceil(totalRowsCount / PAGE_SIZE) || 1;
    document.getElementById("pageInfo").innerText = `${currentPage} / ${maxPage} ページ（全 ${totalRowsCount} 件）`;
    document.getElementById("prevBtn").disabled = (currentPage === 1);
    document.getElementById("nextBtn").disabled = (currentPage >= maxPage);
  }

  async function loadPage(page) {
    currentPage = page;
    msg("取得中…");
    try {
      const rows = await fetchRows(false);
      renderTable(rows);
      msg(`表示しました（${rows.length}件表示中）`);
    } catch(e) { 
      msg("失敗: " + e.message); 
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    // 検索ボタン
    document.getElementById("searchBtn").onclick = () => {
      loadPage(1);
    };

    // ページ切替ボタン
    document.getElementById("prevBtn").onclick = () => {
      if (currentPage > 1) loadPage(currentPage - 1);
    };
    document.getElementById("nextBtn").onclick = () => {
      const maxPage = Math.ceil(totalRowsCount / PAGE_SIZE);
      if (currentPage < maxPage) loadPage(currentPage + 1);
    };

    // CSVダウンロードボタン（表示中に関わらず指定条件の全件をダウンロード）
    document.getElementById("csvBtn").onclick = async ()=>{
      try {
        msg("CSV出力用データ取得中…");
        const rows = await fetchRows(true);
        if(!rows.length) {
          msg("対象データがありません");
          return;
        }
        
        const headers = ["日時","名前","所属","区分","理由","詳細"];
        const lines = [headers.join(","), ...rows.map(r => [
          fmtJstText(r.created_at_jst), 
          r.name, 
          r.department, 
          r.report_type || "", 
          r.type, 
          (r.comment||"").replace(/"/g,'""')
        ].map(v => `"${v}"`).join(","))];
        
        const blob = new Blob(["\uFEFF" + lines.join("\n")], { type:"text/csv" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "欠勤遅刻連絡一覧.csv";
        a.click();
        msg("CSVのダウンロードが完了しました");
      } catch(e) { msg("失敗: " + e.message); }
    };
  });
</script>
</body>
</html>
